name: Release

on:
  push:
    tags:
      - "v0.*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built distributions to PyPI"
        required: true
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install package
        run: uv sync --locked --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Type check
        run: uv run pyright

      - name: Build source and wheel distributions
        run: uv build --no-sources

      - name: Smoke test wheel
        run: uv run --isolated --no-project --with dist/*.whl tests/smoke_installed_package.py

      - name: Smoke test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz tests/smoke_installed_package.py

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: ogcat-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v0.') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: ogcat-dist
          path: dist

      - name: Publish
        run: uv publish --trusted-publishing always
