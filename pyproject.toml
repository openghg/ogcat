[project]
name = "ogcat"
version = "0.1.0"
description = "Lightweight local file catalog with flexible metadata"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "OpenGHG contributors" }]
keywords = ["artifact-catalog", "catalog", "metadata", "openghg"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13.7",
  "tinydb>=4.8",
]

[project.optional-dependencies]
fsspec = [
  "fsspec>=2024.0",
]
netcdf = [
  "xarray>=2024.0",
]

[project.urls]
Documentation = "https://openghg.github.io/ogcat/"
Issues = "https://github.com/openghg/ogcat/issues"
Source = "https://github.com/openghg/ogcat"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pyright>=1.1",
  "ruff>=0.6",
]
docs = [
  "sphinx>=7.0",
  "myst-parser>=2.0",
  "sphinx-autodoc-typehints>=1.25",
  "furo>=2024.0",
]

[project.scripts]
ogcat = "ogcat.cli:app"

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ogcat = ["py.typed"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
