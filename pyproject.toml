[project]
name = "ogcat"
version = "0.1.0"
description = "Lightweight local file catalog with flexible metadata"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenAI" }]
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13.7",
  "tinydb>=4.8",
]

[project.optional-dependencies]
fsspec = [
  "fsspec>=2024.0",
]
netcdf = [
  "xarray>=2024.0",
]
dev = [
  "pytest>=8.0",
  "pyright>=1.1",
  "ruff>=0.6",
]
docs = [
  "sphinx>=7.0",
  "myst-parser>=2.0",
  "sphinx-autodoc-typehints>=1.25",
  "furo>=2024.0",
]

[project.scripts]
ogcat = "ogcat.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
